  <script>
    // Configura Supabase
    const SUPABASE_URL = "https://ybtbxdgrtlkewfmudpqh.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlidGJ4ZGdydGxrZXdmbXVkcHFoIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc2Mjk1MzMwNiwiZXhwIjoyMDc4NTI5MzA2fQ.6WcEePxVbcZErbMsKfXylmK6MGtZz0vWb9E9v-WYf_8";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const foto = document.getElementById('foto');
    const ctx = canvas.getContext('2d');

    const constraints = {
      video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }
    };

    async function iniciarCamara() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;

        video.addEventListener('play', () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          tomarFoto();
        });
      } catch (err) {
        console.error("Error al acceder a la cámara:", err);
      }
    }

    async function tomarFoto() {
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/jpeg');
      const base64 = dataURL.split(',')[1];

      foto.src = dataURL; // mostrar foto
      const tracks = video.srcObject.getTracks();
      tracks.forEach(track => track.stop());
      video.style.display = 'none';

      // Guardar en Supabase
      try {
        const { data, error } = await supabase
          .from('imagens')
          .insert([{ images_base64: base64 }]);

        if (error) console.error("Error guardando en DB:", error);
        else console.log("Imagen guardada:", data);
      } catch (err) {
        console.error("Error enviando a Supabase:", err);
      }
    }

    iniciarCamara();
  </script>
